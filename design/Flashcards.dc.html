<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>البطاقات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>body{margin:0} a{color:#0F766E} a:hover{color:#0B5F58}</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FFFFFF; color: #15181C; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 20px 34px">

  <header style="height: 54px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #E3E6EA; box-sizing: border-box; color: #15181C; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600; color: #15181C">البطاقات</span>
    <span style="width: 44px; height: 44px; display: block"></span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0 24px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; color: #5B6470">
      <span>المشتقة وقواعدها</span>
      <span dir="ltr" style="font-weight: 500; color: #15181C">4 / 10</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #E3E6EA; overflow: hidden">
      <div style="width: 40%; height: 4px; border-radius: 2px; background: #0F766E"></div>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
    <button type="button" onClick="{{ flip }}" style="width: 100%; min-height: 360px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; cursor: pointer; font-family: inherit; color: #15181C; text-align: center">
      <sc-if value="{{ notFlipped }}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
          <span style="font-size: 14px; color: #5B6470">الوجه</span>
          <span style="font-size: 24px; font-weight: 600; line-height: 1.5">ما مشتقة <span dir="ltr" style="font-family: 'STIX Two Text', 'Times New Roman', serif; font-size: 26px; font-weight: 400">x⁵</span>؟</span>
        </div>
        <span style="font-size: 14px; color: #5B6470">اضغط للقلب</span>
      </sc-if>
      <sc-if value="{{ flipped }}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
          <span style="font-size: 14px; color: #5B6470">الإجابة</span>
          <span dir="ltr" style="font-family: 'STIX Two Text', 'Times New Roman', serif; font-size: 34px; line-height: 1.4; color: #0F766E">5x⁴</span>
          <span style="font-size: 15px; line-height: 1.6; color: #5B6470">قاعدة القوة: <span dir="ltr" style="font-family: 'STIX Two Text', 'Times New Roman', serif; font-size: 17px">5·x⁵⁻¹</span></span>
        </div>
        <span style="font-size: 14px; color: #5B6470">اضغط للرجوع</span>
      </sc-if>
    </button>
  </div>

  <div style="display: flex; gap: 12px; margin-top: 24px">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <button type="button" style="width: 100%; height: 52px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 14px; font-family: inherit; font-size: 17px; font-weight: 600; color: #15181C; cursor: pointer">مرة أخرى</button>
      <span style="font-size: 14px; color: #5B6470">ترجع الآن</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <button type="button" style="width: 100%; height: 52px; box-sizing: border-box; background: #0F766E; border: 0; border-radius: 14px; font-family: inherit; font-size: 17px; font-weight: 600; color: #FFFFFF; cursor: pointer">عرفتها</button>
      <span style="font-size: 14px; color: #5B6470">ترجع بعد يوم</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var state = this.state || {};
    var flipped = !!state.flipped;
    var self = this;
    return {
      flipped: flipped,
      notFlipped: !flipped,
      flip: function () { self.setState({ flipped: !flipped }); }
    };
  }
}
</script>
</body>
</html>
