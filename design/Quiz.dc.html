<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var state = this.state || {};
    var picked = typeof state.picked === "number" ? state.picked : 0;
    var self = this;
    return {
      sel0: picked === 0, not0: picked !== 0,
      sel1: picked === 1, not1: picked !== 1,
      sel2: picked === 2, not2: picked !== 2,
      sel3: picked === 3, not3: picked !== 3,
      pick0: function () { self.setState({ picked: 0 }); },
      pick1: function () { self.setState({ picked: 1 }); },
      pick2: function () { self.setState({ picked: 2 }); },
      pick3: function () { self.setState({ picked: 3 }); }
    };
  }
}
